on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

name: Publish VS Code Extension — GitHub Action
run-name: 'Release: ${{ github.ref_name }}'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (Node.js + pnpm)
        uses: jdx/mise-action@v4

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # 只打一次包，两个市场发的是同一个文件。
      # vsce:package 会先跑 clean，所以 *.vsix 必然只匹配到这一次的产物。
      - name: Package
        run: pnpm run vsce:package

      # --packagePath 传现成的包，vsce 不再重新打包，
      # 因此这里不需要 --no-dependencies。
      # 容错处理：
      # 1. 过滤已存在版本错误（already exists），使重试或已发布的版本具备幂等性
      # 2. continue-on-error 确保两家市场互不阻塞，即便一家异常另一家仍会尝试发布
      # 3. 最终通过 Verify publish status 步骤聚合校验，有非预期的真实错误时依然把 CI 置为失败
      - name: Publish to VS Code Marketplace
        id: vsce
        continue-on-error: true
        run: |
          exit_code=0
          output=$(pnpm exec vsce publish --packagePath *.vsix 2>&1) || exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ]; then
            if echo "$output" | grep -iq "already exists"; then
              echo "::warning::VS Code Marketplace: version already exists, skipping."
            else
              exit $exit_code
            fi
          fi
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}

      - name: Publish to Open VSX
        id: ovsx
        continue-on-error: true
        run: |
          exit_code=0
          output=$(pnpm exec ovsx publish *.vsix 2>&1) || exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ]; then
            if echo "$output" | grep -iqE "already (exists|published)"; then
              echo "::warning::Open VSX: version already exists, skipping."
            else
              exit $exit_code
            fi
          fi
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}

      - name: Verify publish status
        if: steps.vsce.outcome == 'failure' || steps.ovsx.outcome == 'failure'
        run: |
          echo "::error::Publish failed: VS Code Marketplace (${{ steps.vsce.outcome }}), Open VSX (${{ steps.ovsx.outcome }})"
          exit 1
