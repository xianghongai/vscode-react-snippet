on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

name: Publish VS Code Extension — GitHub Action
run-name: 'Release: ${{ github.ref_name }}'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (Node.js + pnpm)
        uses: jdx/mise-action@v4

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # 只打一次包，两个市场发的是同一个文件。
      # vsce:package 会先跑 clean，所以 *.vsix 必然只匹配到这一次的产物。
      - name: Package
        run: pnpm run vsce:package

      # --packagePath 传现成的包，vsce 不再重新打包，因此这里不需要 --no-dependencies。
      # --skip-duplicate 由发布工具自身判定版本重复（vsce 比对市场版本列表与 409，
      # ovsx 比对服务端错误），命中时正常退出，不再打印 Error，重跑发布具备幂等性。
      # 其余任何失败都直接冒泡成 job failure，不做降级。
      # grep 只用于补一条 warning 注解，匹配不上至多是少一条注解，不影响成败判定。
      - name: Publish to VS Code Marketplace
        id: vsce
        run: |
          set -o pipefail
          pnpm exec vsce publish --packagePath *.vsix --skip-duplicate 2>&1 | tee "${RUNNER_TEMP:-/tmp}/vsce.log"
          if grep -q "Skipping publish." "${RUNNER_TEMP:-/tmp}/vsce.log"; then
            echo "::warning::VS Code Marketplace: version already published, skipped."
          fi
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}

      # 仅 VS Code Marketplace 失败时不阻塞 Open VSX；
      # Package 等前置步骤失败或 run 被取消时，vsce 的 outcome 不是 failure，此步一并跳过。
      - name: Publish to Open VSX
        if: success() || steps.vsce.outcome == 'failure'
        run: |
          set -o pipefail
          pnpm exec ovsx publish *.vsix --skip-duplicate 2>&1 | tee "${RUNNER_TEMP:-/tmp}/ovsx.log"
          if grep -q "Skipping publish." "${RUNNER_TEMP:-/tmp}/ovsx.log"; then
            echo "::warning::Open VSX: version already published, skipped."
          fi
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
