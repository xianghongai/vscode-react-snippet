on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

name: Publish VS Code Extension — GitHub Action
run-name: 'Release: ${{ github.ref_name }}'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (Node.js + pnpm)
        uses: jdx/mise-action@v4

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # 只打一次包，两个市场发的是同一个文件。
      # vsce:package 会先跑 clean，所以 *.vsix 必然只匹配到这一次的产物。
      - name: Package
        run: pnpm run vsce:package

      # --packagePath 传现成的包，vsce 不再重新打包，
      # 因此这里不需要 --no-dependencies。
      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
